services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ladder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ladder}
      POSTGRES_DB: ladder
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed only on localhost, so `npm run dev` can use it.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ladder -d ladder']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://ladder:${POSTGRES_PASSWORD:-ladder}@db:5432/ladder
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HASH_SALT: ${HASH_SALT:-}
      STORAGE_LIMIT_MB: ${STORAGE_LIMIT_MB:-512}
      REPORT_HIDE_THRESHOLD: ${REPORT_HIDE_THRESHOLD:-3}
      HSTS: ${HSTS:-0}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
