# Mantém atualizados os SHAs das Actions e os digests das imagens fixadas, e as dependências npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # O typescript-eslint ainda não suporta o TypeScript 7 (peer `typescript <6.1.0`).
      # Remover quando uma versão dele aceitar o TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
