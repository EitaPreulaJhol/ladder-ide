name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ladder
          POSTGRES_PASSWORD: ladder
          POSTGRES_DB: ladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ladder -d ladder"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Testes da API com PostgreSQL
        run: npm run test:db
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ladder-ide:ci .
      - name: Smoke test (sem banco)
        run: |
          docker run -d --name app -p 3000:3000 ladder-ide:ci
          for i in $(seq 1 20); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
