name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# O job só lê o repositório: o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: ladder
          POSTGRES_PASSWORD: ladder
          POSTGRES_DB: ladder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ladder -d ladder"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Testes da API com PostgreSQL
        run: npm run test:db
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t ladder-ide:ci .
      - name: Smoke test (sem banco)
        run: |
          docker run -d --name app -p 3000:3000 ladder-ide:ci
          for i in $(seq 1 20); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
